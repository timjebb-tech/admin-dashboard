<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Google Fonts Connections -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    
    <!-- Loads Roboto in Regular (400), Medium (500), and Bold (700) weights -->
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card-container" style="display:flex; gap:16px;"></div>

    <div class="container">
        
        <div class="sidebar">
            <p><img src="images/view-dashboard.svg" alt="home icon" class="scalable-logo"></p>
            <p><span id = dash-header>Dashboard</span> </p>
            
            <p><img src="images/home.svg" alt="home icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Home</a></p>
            
            <p><img src="images/card-account-details-outline.svg" alt="card account details outline icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Profile</a></p>
            
            <p><img src="images/message.svg" alt="message icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Messages</a></p>
            
            <p><img src="images/clock-time-three-outline.svg" alt="clock icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">History</a></p>
            
            <p><img src="images/file-multiple-outline.svg" alt="files icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Tasks</a></p>
            
            <p><img src="images/account-group.svg" alt="account group icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Communities</a></p>
            
            <p><img src="images/cog.svg" alt="cog icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Settings</a></p>

            <p><img src="images/help-box.svg" alt="help icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Support</a></p>
            
            <p><img src="images/shield-check.svg" alt="shield tick icon" class="scalable-logo"></p>
            <p><a href="javascript:void(0);" class="dash-item">Privacy</a></p>

        </div>
        <div class="header-container">
            
            <div class="header">
                
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input class="search-bar" type="text" name="search-term">
                </div>
                <img src="images/bell-ring-outline.svg" alt="ringing bell icon" class="scalable-logo-noinvert">
                <img src="images/cat.svg" alt="cat icon" class="scalable-logo-yellow">
                <p><b>Organ Morgan</b></p>

            </div>
            <div class="header">
                <img src="images/cat.svg" alt="cat icon" class="scalable-logo-yellow-big">
                <div class="greeting">
                    <p>Hi there</p>
                    <p>Organ Morgan (@Organ)</p>
                </div>
                <button class="butt">New</button>
                <button class="butt">Upload</button>
                <button class="butt">Share</button>

            </div>
        </div>
            
        <div class="extras">
            <div class="announcements">
                <div class="announcement">announcement 1</div>
                <div class="announcement">announcement 2</div>
                <div class="announcement">announcement 3</div>
            </div>
            <div class="trending">
                <div class="trending">trending 1</div>
                <div class="trending">trending 2</div>
                <div class="trending">trending 3</div>
            </div>
        </div>
        <div class="projects-container">
            <div class="project-title">
                <h1>Your Projects</h1>
            </div>
            <div class="projects-cards-container" id="project-card-hook">
                
            </div>   
        </div>

    </div>


     <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script type="module">
        import { cardBlueprint } from './script/card-component.js';

        function generateCard(title, text, targetContainerId) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(cardBlueprint, 'text/html');
            const cardElement = doc.body.firstElementChild;

            // Inject the text strings
            cardElement.querySelector('.card-title').textContent = title;
            cardElement.querySelector('.card-text').textContent = text;
            const maxLength = 100;
            cardElement.querySelector('.card-text').textContent = text.length > maxLength ? text.slice(0, maxLength) + '...' : text;

            // Find the specific container by its ID and insert the card into it
            document.getElementById(targetContainerId).appendChild(cardElement);
        }

        generateCard(
        "Primary Analytics", 
        "Some details about the project", 
        "project-card-hook"
        );
        generateCard(
        "Secondary Analytics", 
        "Some different details about a different  project", 
        "project-card-hook"
        );
        generateCard(
        "Tertiary Analytics", 
        "No details at all just some gibberish, rhubarb, filler, xyzzy, idkfa and a fruitbat", 
        "project-card-hook"
        );
        generateCard(
        "Quaternary Analytics", 
        "Azerbaijan is beautiful at this time of year but watch out for the camels", 
        "project-card-hook"
        );
        generateCard(
        "Something Else", 
        "From Harold. He's that most dangerous of creatures, a clever sheep. 'e's realized that a sheep's life consists of standin' around for a few months and then bein' eaten. And that's a depressing prospect for an ambitious sheep.", 
        "project-card-hook"
        );
    </script>
</body>
</html>
